---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: reference_data\/.*
      - id: end-of-file-fixer
        exclude: reference_data\/.*
      - id: check-yaml
        exclude: reference_data\/.*
      - id: check-merge-conflict
        exclude: reference_data\/.*

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint-fix
        args:
          - "--ignore"
          - terraform

  - repo: local
    hooks:
      - id: briar
        name: Briar (offline secret scan)
        language: docker_image
        # Keep the image version and digest aligned with flake.nix.
        entry: ghcr.io/willfish/briar:v0.1.0@sha256:8e36caa3ef5892e45435d5388632d63f25e50224cee01678b82503eecc7cf728
        args: ["--"]
        types: [file]
        require_serial: true

  - repo: https://github.com/rhysd/actionlint.git
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

name: deploy-to-production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'deploy-to-staging'
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::382373577178:role/GithubActions-Serverless-Lambda-Role
          aws-region: eu-west-2

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11

      - run: |
          python -m venv venv
          source venv/bin/activate
          pip install requests==2.32.0

      - run: .github/bin/fetchmodel production

      - run: .github/bin/download_search_references

      - id: docker-tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: trade-tariff/trade-tariff-tools/.github/actions/build-and-push@main
        with:
          ecr-url: 382373577178.dkr.ecr.eu-west-2.amazonaws.com/tariff-fpo-search-production
          ref: ${{ steps.docker-tag.outputs.DOCKER_TAG }}
          role-to-assume: arn:aws:iam::382373577178:role/GithubActions-Serverless-Lambda-Role

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::382373577178:role/GithubActions-Serverless-Lambda-Role
          aws-region: eu-west-2

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0

      - run: npm install -g serverless@3

      # TODO: pinned below 10.3.0 because that release switched credential resolution to
      # getAwsSdkV3Config(), which only works with the newer `osls` v4 fork. We're still on
      # `serverless@3` above, so latest breaks with "Resolved credential object is not valid".
      # Unpin once this repo migrates to osls/serverless v4, or the plugin restores v3 support.
      - run: npm install -g serverless-domain-manager@10.2.0

      - id: docker-tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - run: make deploy-production
        env:
          STAGE: production
          DOCKER_TAG: ${{ steps.docker-tag.outputs.DOCKER_TAG }}
          FPO_SEARCH_ECR_URL: 382373577178.dkr.ecr.eu-west-2.amazonaws.com/tariff-fpo-search-production

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: trade-tariff/trade-tariff-tools/.github/actions/slack-notify@main
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          channel: production-deployments
          color: ${{ needs.deploy.result }}
          message: "Deployment of trade-tariff-lambdas-fpo-search to production ${{ needs.deploy.result }}"

  tag:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7.0.1

      - id: docker-tag
        run: echo "DOCKER_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: trade-tariff/trade-tariff-tools/.github/actions/tag-production@main
        with:
          ecr-url: 382373577178.dkr.ecr.eu-west-2.amazonaws.com/tariff-fpo-search-production
          ref: ${{ steps.docker-tag.outputs.DOCKER_TAG }}
          role-to-assume: arn:aws:iam::382373577178:role/GithubActions-Serverless-Lambda-Role

name: automated-model-build

on:
    workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automated-build-model:
    runs-on: ubuntu-latest

    steps:
      - name: Mint trade-tariff-pr-bot token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Run create pr script
        run: .github/bin/createpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

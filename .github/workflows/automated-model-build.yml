name: automated-model-build

on:
    workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automated-build-model:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.PULL_REQUEST_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Run create pr script
        run: .github/bin/createpr

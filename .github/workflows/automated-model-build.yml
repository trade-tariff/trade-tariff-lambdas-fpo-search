name: automated-model-build

on:
    workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automated-build-model:
    runs-on: ubuntu-latest

    steps:
      # Short-lived token scoped to this repo. Masked in logs and revoked when
      # the job ends.
      - name: Mint trade-tariff-pr-bot token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.TRADE_TARIFF_PR_BOT_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - uses: trade-tariff/trade-tariff-tools/.github/actions/setup-ssh@main
        with:
          ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}

      - name: Run create pr script
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/bin/createpr
